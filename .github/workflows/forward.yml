# ============================================
#  forward.yml - runs the poller every 10 minutes and commits the state
# ============================================
name: forward

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tg2vibe-forwarder
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ./vendor/vibegram

      - name: Run poller
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNELS: ${{ vars.TG_CHANNELS }}
          TG_AUTO_JOIN: "1"
          VIBE_BOT_TOKEN: ${{ secrets.VIBE_BOT_TOKEN }}
          VIBE_CHAT_ID: ${{ secrets.VIBE_CHAT_ID }}
          VIBE_BASE_URL: ${{ vars.VIBE_BASE_URL || 'https://api.vibegram.chat' }}
          MEDIA_LIMIT_MB: "50"
          SEND_DELAY: "1.0"
          BACKFILL: "0"
        run: python poller.py

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "update forwarder state [skip ci]"
            git push
          fi
